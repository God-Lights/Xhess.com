name: Release

# Windows/Linux 설치 파일을 빌드해 GitHub Release 로 올린다.
# 설치 사이트(site/main.js)가 이 릴리스의 최신 에셋을 읽어 다운로드 링크를 만든다.
# 태그를 푸시하거나, Actions 탭(또는 API)에서 수동 실행하며 tag 를 입력하면 된다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스 태그 (예: v0.1.0). 없으면 현재 커밋에 새로 만든다."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Xhess ${{ inputs.tag || github.ref_name }}"
          commitish: ${{ github.sha }}
          releaseDraft: false
          prerelease: false
