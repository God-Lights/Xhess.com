<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Xhess</title>
    <meta name="theme-color" content="#262421" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Xhess" />
  </head>
  <body>
    <div id="app">
      <main class="layout">
        <section class="board-col">
          <div class="board-wrap">
            <div class="evalbar" title="엔진 평가"><div id="evalFill"></div></div>
            <div id="board" class="board"></div>
          </div>
          <div id="status" class="status">로딩 중…</div>
        </section>
        <aside class="panel">
          <h1>Xhess</h1>
          <div class="row">
            <label>내 색
              <select id="side"><option value="white">백</option><option value="black">흑</option></select>
            </label>
            <label>난이도 <output id="lvlOut">8</output>
              <input id="level" type="range" min="0" max="20" value="8" />
            </label>
          </div>
          <div class="row">
            <label>엔진 모드
              <select id="engineMode">
                <option value="best">표준 (최선수)</option>
                <option value="human">인간 모드 (희생·실수)</option>
              </select>
            </label>
          </div>
          <div id="humanOpts" class="row" hidden>
            <label>실수 빈도 <output id="humanOut">40</output>
              <input id="humanness" type="range" min="0" max="100" value="40" />
            </label>
            <label>희생 성향 <output id="boldOut">50</output>
              <input id="boldness" type="range" min="0" max="100" value="50" />
            </label>
          </div>
          <div id="humanNote" class="human-note" hidden></div>
          <div class="row buttons">
            <button id="newGame">새 게임</button>
            <button id="undo">무르기</button>
            <button id="flip">보드 뒤집기</button>
            <button id="copyPgn">PGN 복사</button>
          </div>
          <div id="engineLabel" class="info"></div>
          <div id="enginePicker" class="row picker" hidden>
            <label>외부 UCI 엔진 경로 (비우면 기본 Stockfish)
              <input id="enginePath" type="text" placeholder="예: C:\engines\albatross.exe" spellcheck="false" />
            </label>
            <button id="applyEngine">엔진 적용</button>
          </div>
          <section class="marks">
            <label class="check"><input id="marksOn" type="checkbox" checked /> 전략 마킹</label>
            <div class="legend">
              <span><i class="sw green"></i>추천 수</span><span><i class="sw red"></i>예상 응수</span>
              <span><i class="sw blue"></i>대안 1</span><span><i class="sw yellow"></i>대안 2</span>
            </div>
            <p class="hint">평가값은 내 관점(+가 유리). 보드에서 <b>오른쪽 클릭 드래그</b>로 내 계획 화살표를 그리면 엔진이 평가합니다.</p>
            <ol id="cands" class="cands"></ol>
            <div id="planBox" class="plan" hidden></div>
          </section>
          <div id="info" class="info"></div>
          <ol id="moves" class="moves"></ol>
        </aside>
      </main>
      <div id="promo" class="promo" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
